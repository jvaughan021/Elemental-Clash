<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Elemental Clash</title><style>
:root{font-family:system-ui,Segoe UI,sans-serif;color:#edf2ff;background:#0b1020}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#25315b,#0b1020 65%);min-height:100vh}button,input,select{font:inherit}button{background:#283861;color:white;border:1px solid #506398;border-radius:10px;padding:9px 12px;cursor:pointer}button:hover{background:#3c5186}button:disabled{opacity:.4;cursor:not-allowed}.primary{background:#6654d9}.wrap{max-width:1150px;margin:auto;padding:16px}header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}h1{font-size:clamp(25px,5vw,40px);margin:10px 0}h2{margin:0 0 14px}h3{margin:12px 0}nav{display:flex;gap:7px;flex-wrap:wrap;margin:18px 0}.panel{background:#151e37;border:1px solid #334469;border-radius:16px;padding:16px;margin-bottom:14px;box-shadow:0 8px 25px #05081355}.stats{display:flex;gap:10px;flex-wrap:wrap}.pill{background:#253457;border-radius:999px;padding:7px 12px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(175px,1fr));gap:10px}.card{background:linear-gradient(145deg,#273456,#161f39);border:1px solid #546389;border-radius:13px;padding:12px;min-height:125px}.card strong{display:block;margin-bottom:6px}.card small{color:#aebbe0}.card button{margin-top:8px}.muted{color:#aab8da}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.row>*{max-width:100%}.split{display:grid;grid-template-columns:1fr 1fr;gap:14px}input,select{background:#101a30;color:white;border:1px solid #506398;border-radius:8px;padding:9px;max-width:100%}.bar{height:15px;background:#4c2638;border-radius:10px;overflow:hidden}.bar>div{height:100%;background:#34c88b;transition:width .3s}.log{height:160px;overflow:auto;background:#0d1428;border-radius:10px;padding:10px;font-size:13px}.tiny{font-size:12px}.battle-banner{padding:12px;border:1px solid #556b9e;border-radius:12px;background:#202d50;margin:12px 0}.battle-banner strong{font-size:18px}.battle-actions{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}.battle-card{border-color:#7783b4}.battle-card:hover{border-color:#b8b9ff}.good{color:#77e9ae}.bad{color:#ff9c9c}@media(max-width:650px){.split{grid-template-columns:1fr}.wrap{padding:10px}.panel{padding:12px}}
.element-guide{margin:18px 0;padding:15px;border:1px solid #445781;border-radius:14px;background:#111c36}.element-guide h3{margin-top:0}.matchup-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px}.matchup-card{background:#1b2946;border:1px solid #354669;border-radius:10px;padding:12px;line-height:1.7}.matchup-card strong{display:block;margin-bottom:5px}.matchup-good{color:#86efac}.matchup-bad{color:#fda4af}.matchup-neutral{color:#cbd5e1}
.tactic{border:1px solid #4b668c;background:#182744;border-radius:12px;padding:12px;margin:12px 0}.tactic strong{display:block;margin-bottom:6px}.advantage{color:#86efac}.disadvantage{color:#fda4af}.neutral{color:#cbd5e1}.card-tip{margin-top:8px;font-weight:700;font-size:12px}</style></head><body><div class="wrap"><header><div><h1>⚔️ Elemental Clash</h1><div class="muted">Forge your cards. Master the elements. Rise through the ranks.</div></div><div id="stats" class="stats"></div></header><nav id="nav"></nav><main id="app"></main><footer class="muted tiny">Single-file game • Local progress is saved automatically • Firebase online rooms • Local progress saved on this device</footer></div><script>

const FIREBASE_CONFIG=null;
const E=['Fire','Water','Air','Earth','Spirit','Shadow'],EM=['🔥','💧','🌪️','🌿','✨','🌑'];

const rarity=['Common','Uncommon','Rare','Epic','Legendary'],roman=['I','II','III','IV','V'],bases=[5,6,8,9,11,12,14,16,17,19,21,22,24,26,28,30],mult=[1,1.5,2.25,3.5,5],prices=[50,65,90,110,145,175,220,275,340,420,520,640,790,975,1200,1500],forgePrices=[2500,15000,100000,750000];
const shieldNames=[['Ember Ward','Tide Ward','Gale Ward','Stone Ward','Soul Ward','Dusk Ward','Steam Guard','Ashen Guard','Stormleaf Guard','Mire Guard','Spiritveil Guard','Twilight Guard','Wooden Guard','Stone Barrier','Copper Buckler','Bark Shell','Clay Bulwark','Ironwood Wall','Pebble Fortress','Bronze Bastion'],['Flame Ward','River Ward','Wind Ward','Root Ward','Astral Ward','Night Ward','Cinder Current','Scorched Grove','Mist Shroud','Dust Cyclone','Soulshade Barrier','Moonlit Canopy','Iron Fortress','Silver Guard','Reinforced Wall','Runic Bulwark','Guardian Plate','Tempered Bastion','Fortified Shell','Steel Rampart'],['Inferno Ward','Tidal Sanctuary','Tempest Ward','Granite Ward','Spectral Ward','Void Ward','Boiling Veil','Stormtide Ward','Earthen Tempest','Radiant Ember','Abyssal Current','Phantom Gale','Crystal Bulwark','Diamond Guard','Runestone Fortress','Enchanted Rampart','Adamant Wall','Prismatic Bastion','Titan Shell','Arcane Bulwark'],['Phoenix Ward','Abyssal Ward','Skybreaker Ward','Earthen Bastion','Celestial Ward','Eclipse Ward','Solar Tide Barrier','Wildfire Canopy','Hurricane Reef','Sacred Grove','Spirit Eclipse','Obsidian Cyclone','Celestial Aegis','Titanium Fortress','Mythic Rampart','Dragonplate Guard','Ancient Bulwark','Immortal Bastion','Starforged Wall','Royal Aegis'],['Eternal Flame Ward','Leviathan Ward','Heavenstorm Ward','Worldroot Ward','Divine Soul Ward','Endless Night Ward','Primordial Steamguard','Cosmic Tempest Ward','Apocalypse Canopy','Genesis Barrier','Eclipse Dominion','Eternal Stormveil','Divine Fortress','Eternal Aegis','Worldshield','Celestial Citadel',"Titan King’s Guard",'Infinity Bastion','Astral Fortress','Omnipotent Aegis']];
const absorb=[[15,20,25,30,35,40,45,50],[50,55,60,70,75,85,90,100],[100,115,130,145,160,175,190,200],[200,220,240,260,280,300,325,350],[350,380,410,450,490,530,570,600]];
const heals=[['Minor Remedy',15],['Healing Touch',25],['Vital Surge',50],["Nature’s Blessing",75],['Restoration Pulse',125],['Sacred Renewal',175],['Divine Recovery',250],['Phoenix Rebirth',350],['Miracle of Life',500],['Eternal Restoration',750]];
const pair=[[0,1],[0,3],[1,2],[2,3],[4,5],[2,5]];
const cards=[];for(let r=0;r<5;r++){for(let e=0;e<6;e++)for(let i=0;i<16;i++)cards.push({id:`a${e}-${i}-${r}`,kind:'attack',name:names[e][i]+' '+roman[r],element:e,rarity:r,damage:Math.round(bases[i]*mult[r]),price:prices[i],bonus:r*.05});for(let i=0;i<20;i++){const type=i<6?'single':i<12?'dual':'absorb',targets=i<6?[i]:i<12?pair[i-6]:[],duration=type==='absorb'?([ [1,1,2,2,1,2,1,2],[2,2,3,2,3,2,3,3],[2,3,3,4,3,4,3,4],[3,4,4,5,4,5,5,5],[4,4,5,5,6,5,6,6] ][r][i-12]):Math.min(6,1+Math.min(2,r)+(i%2)+(r>=3?1:0));cards.push({id:`s${i}-${r}`,kind:'shield',name:shieldNames[r][i],rarity:r,type,targets,duration,absorb:type==='absorb'?absorb[r][i-12]:0,price:Math.round((150+i*65)*Math.pow(8,r))})}for(let j=0;j<2;j++){let i=r*2+j;cards.push({id:`h${i}`,kind:'heal',name:heals[i][0],heal:heals[i][1],rarity:r,price:[100,200,1000,2000,8000,15000,60000,100000,400000,750000][i]})}}
const ranks=['Elemental Recruit','Elemental Novice','Spark Initiate','Apprentice','Battle Adept','Arcane Fighter','Elemental Disciple','Mystic Warrior','Rune Wielder','Elemental Knight','Storm Vanguard','Arcane Guardian','Flame Sentinel','Elemental Champion','Mystic Commander','Arcane Warlord','Dragonheart','Astral Conqueror','Elemental Overlord','Storm Sovereign','Void Reaper','Infernal Monarch','Celestial Ascendant','Primordial Titan','Eternal Warlord','Elemental Emperor','Cosmic Dominator','Astral Deity','Supreme Elementalist','Primordial Godslayer','Elemental Omnipotent'];
const expReq=[100,140,190,250,330,450,610,820,1100,1490,2010,2710,3660,4950,6680,9020,12170,16430,22180,29950,40430,54580,73680,99470,134280,181280,244720,330380,446010,602110];
const upgradeGroups=[['Health & Survival',[['Maximum HP',37],['Healing Power',30],['Healing Efficiency',25],['Emergency Recovery',20],['Last Stand',20],['Recovery Boost',25],['Vitality Mastery',35]]],['Attack & Damage',[['Attack Power',40],['Critical Chance',30],['Critical Damage',35],['Armour Piercing',30],['Shield Breaker',30],['Elemental Precision',25],['Combat Momentum',25]]],['Elemental Mastery',[...E.map(e=>[e+' Mastery',35]),['Elemental Resistance',40],['Elemental Advantage',30]]],['Shields & Defence',[['Shield Strength',40],['Shield Duration',30],['Shield Efficiency',25],['Shield Reinforcement',30],['Dual-Element Defence',25],['Shield Recovery',20],['Defensive Mastery',35]]],['Forging & Cards',[['Forge Efficiency',30],['Forge Mastery',30],['Card Collector',30],['Card Training',35],['Rarity Mastery',25],['Forge Expertise',25]]],['Economy & Progression',[['BP Earnings',40],['Victory Rewards',35],['EXP Boost',40],['Shop Discount',30],['Battle Rewards',35]]]];
const upgrades=upgradeGroups.flatMap((g,gi)=>g[1].map(([name,max],i)=>({name,max,group:g[0],base:gi===0?100+i*65:gi===1?250+i*125:gi===2?200+i*75:gi===3?200+i*100:gi===4?500+i*300:300+i*300})));
const intervals=[86400,43200,21600,10800,3600,1800,900,600,300,120,60,45,30,20,15,10,8,5,2,1];
const fmt=n=>Math.floor(n).toLocaleString('en-GB');const money=n=>n>=1e12?(n/1e12).toFixed(2)+'T':n>=1e9?(n/1e9).toFixed(2)+'B':n>=1e6?(n/1e6).toFixed(2)+'M':fmt(n);const round5=n=>Math.round(n/5)*5;
function fresh(){let owned={};for(let e=0;e<6;e++)for(let i=0;i<4;i++)owned[`a${e}-${i}-0`]=1;return{bp:0,exp:0,rank:1,owned,deck:[],up:{},vault:{interest:1,frequency:1,pending:0,last:Date.now(),fraction:0},wins:0,losses:0,lastWinDay:'',created:Date.now()}}
let state;try{state=JSON.parse(localStorage.getItem('elemental-clash-v1'))||fresh()}catch{state=fresh()}state.vault||=(fresh().vault);state.up||={};state.owned||={};state.deck||=[];
let tab='Home',battle=null,filter='All',rarityFilter='All',notice='';const app=document.getElementById('app');const byId=id=>cards.find(c=>c.id===id);const upLevel=n=>state.up[n]||0;const maxHP=()=>150+50*upLevel('Maximum HP');
function vaultPayment(l){let n=10;for(let i=1;i<l;i++)n=Math.round(n*1.5);return n}function vaultTick(){let v=state.vault,now=Date.now(),elapsed=Math.max(0,Math.min((now-v.last)/1000,604800));if(!Number.isFinite(elapsed))elapsed=0;let accrued=elapsed*vaultPayment(v.interest)/intervals[v.frequency-1]+(v.fraction||0);let whole=Math.floor(accrued);v.pending+=whole;v.fraction=accrued-whole;v.last=now}function save(){localStorage.setItem('elemental-clash-v1',JSON.stringify(state))}function message(t){notice=t;render()}
function cardText(c){return `${c.kind==='attack'?EM[c.element]+' '+E[c.element]:c.kind==='shield'?'🛡️':'❤️'} ${c.name}`}
function cardInfo(c){return c.kind==='attack'?`${c.damage} damage · ${rarity[c.rarity]} · +${Math.round(c.bonus*100)}% next attack`:c.kind==='heal'?`Restore ${c.heal} HP · ${rarity[c.rarity]}`:`${c.type==='absorb'?'Absorb '+c.absorb+' damage':'Immune to '+c.targets.map(i=>E[i]).join(' + ')} · ${c.duration} turns · ${rarity[c.rarity]}`}
function cardHTML(c,buttons=''){return `<div class="card"><strong>${cardText(c)}</strong><small>${cardInfo(c)}</small><div class="tiny muted">Owned: ${state.owned[c.id]||0}</div>${buttons}</div>`}
function ownedCards(){return cards.filter(c=>state.owned[c.id]>0)}
function deckValid(){if(state.deck.length!==30)return false;const counts={};for(const id of state.deck){counts[id]=(counts[id]||0)+1;if(counts[id]>Math.min(2,state.owned[id]||0))return false}return true}
function nav(){const tabs=['Home','Battle','Collection','Shop','Forge','Upgrades','Vault','Ranks','Online'];document.getElementById('nav').innerHTML=tabs.map(t=>`<button class="${tab===t?'primary':''}" data-tab="${t}">${t}</button>`).join('')}
function render(){vaultTick();nav();document.getElementById('stats').innerHTML=`<span class="pill">💰 ${money(state.bp)} BP</span><span class="pill">🏆 Rank ${state.rank}</span><span class="pill">✨ ${expProgress()}</span>`;let html=notice?`<div class="panel good">${notice}</div>`:'';notice='';if(tab==='Home')html+=home();if(tab==='Collection')html+=collection();if(tab==='Shop')html+=shop();if(tab==='Forge')html+=forge();if(tab==='Upgrades')html+=upgradeScreen();if(tab==='Vault')html+=vaultScreen();if(tab==='Ranks')html+=rankScreen();if(tab==='Battle')html+=battleScreen();if(tab==='Online')html+=onlineScreen();app.innerHTML=html;save();if(tab==='Online')window.renderOnline?.()}
function home(){return `<div class="panel"><h2>Welcome to Elemental Clash</h2><p>Collect and forge cards, strengthen your fighter, and battle the training opponent. Your progress saves on this device.</p><div class="stats"><span class="pill">🃏 ${ownedCards().length} card types</span><span class="pill">⚔️ ${state.wins} wins</span><span class="pill">❤️ ${maxHP()} max HP</span><span class="pill">🏦 ${money(state.vault.pending)} BP waiting</span></div></div><div class="split"><div class="panel"><h3>⚔️ Training Battle</h3><p class="muted">Fight an AI opponent with real turns, shields, healing, elemental modifiers and rewards.</p><button data-tab="Battle" class="primary">Enter Battle</button></div><div class="panel"><h3>🏦 Offline Vault</h3><p class="muted">Earn BP automatically while away. Upgrade interest and payment speed.</p><button data-tab="Vault">Open Vault</button></div></div><div class="panel"><h3>New game / saved progress</h3><p class="muted">New players begin with 0 BP. This browser may still have BP from an older saved game.</p><button data-action="resetSave">Start fresh (reset all progress)</button></div><div class="panel"><h3>Getting started</h3><p>You own 24 Common attack cards. Visit Collection to build a 30-card deck after buying six additional cards from the Shop. The training battle also supports an automatic starter deck while you're collecting.</p></div>`}
function collection(){let list=ownedCards().filter(c=>filter==='All'||c.kind===filter);return `<div class="panel"><h2>🃏 Collection</h2><div class="row"><span>Deck: ${state.deck.length}/30 ${deckValid()?'✓ Ready':'· Incomplete'}</span><button data-action="autoDeck">Auto-build deck</button><button data-action="clearDeck">Clear deck</button><select id="filter"><option>All</option><option value="attack" ${filter==='attack'?'selected':''}>Attack</option><option value="shield" ${filter==='shield'?'selected':''}>Shield</option><option value="heal" ${filter==='heal'?'selected':''}>Healing</option></select></div><p class="muted">Up to two copies of an identical card and rarity may be placed in a deck.</p><div class="grid">${list.map(c=>cardHTML(c,`<button data-action="addDeck" data-id="${c.id}">Add to deck</button> <button data-action="removeDeck" data-id="${c.id}">Remove</button><div class="tiny">In deck: ${state.deck.filter(x=>x===c.id).length}</div>`)).join('')}</div></div>`}
function shop(){let list=cards.filter(c=>c.kind==='attack'&&c.rarity===0||c.kind==='shield'&&c.rarity===0||c.kind==='heal').filter(c=>rarityFilter==='All'||c.kind===rarityFilter);return `<div class="panel"><h2>🛒 Card Shop</h2><p class="muted">Buy Common attacks and shields, or healing cards of any rarity. Forge stronger attacks and shields.</p><select id="rarityFilter"><option>All</option><option value="attack" ${rarityFilter==='attack'?'selected':''}>Attacks</option><option value="shield" ${rarityFilter==='shield'?'selected':''}>Shields</option><option value="heal" ${rarityFilter==='heal'?'selected':''}>Healing</option></select><div class="grid" style="margin-top:12px">${list.map(c=>cardHTML(c,`<button data-action="buy" data-id="${c.id}">Buy ${money(Math.max(5,round5(c.price*(1-Math.min(.3,upLevel('Shop Discount')*.01)))))} BP</button>`)).join('')}</div></div>`}
function forge(){let list=ownedCards().filter(c=>c.rarity<4);return `<div class="panel"><h2>🔨 Forge</h2><p class="muted">Combine two identical cards of the same rarity into one higher-rarity card. Forging never fails.</p><div class="grid">${list.map(c=>{let next=byId(c.id.replace(/-\d$/,`-${c.rarity+1}`));if(!next)return '';let cost=Math.max(5,round5(forgePrices[c.rarity]*(1-Math.min(.3,upLevel('Forge Efficiency')*.01))));return cardHTML(c,`<div class="tiny">Next: ${next.name}</div><button data-action="forge" data-id="${c.id}" ${(state.owned[c.id]<2||state.bp<cost)?'disabled':''}>Forge ${money(cost)} BP</button>`) }).join('')}</div></div>`}
function upgradeCost(u){return round5(u.base*Math.pow(1.4,upLevel(u.name)))}function upgradeScreen(){return `<div class="panel"><h2>📈 Upgrades</h2><p class="muted">40 upgrade categories. Upgrade effects are applied in training battles and the economy. BP costs rise 40% per level.</p></div>${upgradeGroups.map(g=>`<div class="panel"><h3>${g[0]}</h3><div class="grid">${g[1].map(([name,max])=>{let u=upgrades.find(x=>x.name===name),l=upLevel(name),cost=upgradeCost(u);return `<div class="card"><strong>${name}</strong><small>Level ${l}/${max}</small><div><button data-action="upgrade" data-id="${name}" ${l>=max||state.bp<cost?'disabled':''}>${l>=max?'MAX':money(cost)+' BP'}</button></div></div>`}).join('')}</div></div>`).join('')}`}
function vaultCost(which){let v=state.vault,l=v[which];return round5((which==='interest'?250:500)*Math.pow(which==='interest'?1.8:2.5,l-1))}function vaultScreen(){let v=state.vault,p=vaultPayment(v.interest),sec=intervals[v.frequency-1];return `<div class="panel"><h2>🏦 BP Vault</h2><p class="muted">Generates BP automatically online and offline. Up to seven days of elapsed time can accumulate between visits.</p><div class="stats"><span class="pill">💰 ${money(v.pending)} BP waiting</span><span class="pill">⏱️ Every ${sec>=3600?sec/3600+' hours':sec>=60?sec/60+' minutes':sec+' seconds'}</span><span class="pill">📈 ${money(p)} BP/payment</span></div><p><button class="primary" data-action="collect">Collect ${money(v.pending)} BP</button></p><div class="grid"><div class="card"><strong>Interest Amount</strong><p>Level ${v.interest}/50</p><p>${money(p)} BP per payment</p><button data-action="vaultInterest" ${v.interest>=50||state.bp<vaultCost('interest')?'disabled':''}>${v.interest>=50?'MAX':`Upgrade ${money(vaultCost('interest'))} BP`}</button></div><div class="card"><strong>Payment Frequency</strong><p>Level ${v.frequency}/20</p><p>${sec} seconds per payment</p><button data-action="vaultFrequency" ${v.frequency>=20||state.bp<vaultCost('frequency')?'disabled':''}>${v.frequency>=20?'MAX':`Upgrade ${money(vaultCost('frequency'))} BP`}</button></div></div><h3>Projected earnings</h3><div class="stats"><span class="pill">Second: ${money(p/sec)} BP</span><span class="pill">Minute: ${money(p*60/sec)} BP</span><span class="pill">Hour: ${money(p*3600/sec)} BP</span><span class="pill">Day: ${money(p*86400/sec)} BP</span></div></div>`}
function expProgress(){let req=expReq[state.rank-1]||0;return state.rank>=31?'MAX RANK':`${fmt(state.exp)} / ${fmt(req)} EXP to next rank (${Math.max(0,req-state.exp).toLocaleString('en-GB')} remaining)`}
function rankScreen(){return `<div class="panel"><h2>🏆 Ranks</h2><p>Current: <strong>${state.rank}. ${ranks[state.rank-1]}</strong></p><p class="muted">EXP is earned from battle damage and match results. Your EXP carries over when you rank up. You can advance at most one rank per completed battle.</p><p><strong>${expProgress()}</strong></p><div style="height:12px;background:#263450;border-radius:12px;overflow:hidden"><div style="height:100%;background:#75b7f9;width:${state.rank===31?100:Math.min(100,100*state.exp/expReq[state.rank-1])}%"></div></div>${ranks.map((name,i)=>`<div class="row" style="padding:7px;border-bottom:1px solid #293a5a"><span style="min-width:45px">${i+1}</span><span style="flex:1">${name}</span><span class="muted">${i===30?'MAX':fmt(expReq[i])+' EXP'}</span></div>`).join('')}</div>`}

const drawCard=p=>{if(!p.deck.length&&p.discard.length){p.deck=mix(p.discard);p.discard=[]}if(p.deck.length&&p.hand.length<10)p.hand.push(p.deck.shift())};
async function attack(i){if(!roomCode)return;const c=roomCode;await runTransaction(db,async tx=>{const ref=doc(db,'rooms',c),snap=await tx.get(ref);if(!snap.exists())throw Error('Room no longer exists');const r=snap.data(),side=r.host===uid?0:r.guest===uid?1:-1;if(side<0||r.status!=='playing'||r.turn!==side)throw Error('Not your turn');if(!Number.isInteger(i)||i<0||i>=r.players[side].hand.length)throw Error('Invalid card position');const players=JSON.parse(JSON.stringify(r.players)),me=players[side],foe=players[1-side],id=me.hand[i],played=card(id);if(!played)throw Error('Invalid card');const hp=[...r.hp],active=[...r.active],other=1-side;me.hand.splice(i,1);me.discard.push(id);let msg='';
 if(played.kind==='attack'){let damage=Math.round(played.damage*(1+(me.buff||0)));if(active[other]>=0)damage=Math.max(1,Math.round(damage*(strong[played.element].includes(active[other])?1.25:weak[played.element].includes(active[other])?.75:1)));if(foe.shield){if(foe.shield.targets?.includes(played.element))damage=0;else if(foe.shield.absorb>0){const blocked=Math.min(damage,foe.shield.absorb);damage-=blocked;foe.shield.absorb-=blocked;if(foe.shield.absorb<=0)foe.shield=null}}hp[other]=Math.max(0,hp[other]-damage);active[side]=played.element;me.buff=played.bonus||0;msg=`${side===0?'Host':'Guest'} used ${played.name} for ${damage} damage`}
 else if(played.kind==='heal'){const healed=Math.min(played.heal,r.max[side]-hp[side]);hp[side]+=healed;msg=`${side===0?'Host':'Guest'} healed ${healed} HP`}
 else {me.shield={name:played.name,targets:played.targets||[],absorb:played.absorb||0,duration:played.duration};msg=`${side===0?'Host':'Guest'} activated ${played.name}`}
 if(foe.shield){foe.shield.duration--;if(foe.shield.duration<=0)foe.shield=null}
 drawCard(me);const ended=hp[other]===0||r.move>=119;const winner=hp[other]===0?side:r.move>=119?(hp[0]/r.max[0]===hp[1]/r.max[1]?-1:hp[0]/r.max[0]>hp[1]/r.max[1]?0:1):-1;
 tx.update(ref,{hp,active,players,turn:ended?side:other,status:ended?'finished':'playing',winner,move:(r.move||0)+1,lastAction:{side,cardId:id,kind:played.kind,index:i,previousMove:r.move},log:[msg,...(r.log||[])].slice(0,35)})})}
async function concede(){if(!roomCode)return;await runTransaction(db,async tx=>{const ref=doc(db,'rooms',roomCode),snap=await tx.get(ref);if(!snap.exists())throw Error('Room not found');const r=snap.data(),side=r.host===uid?0:r.guest===uid?1:-1;if(side<0||r.status!=='playing')throw Error('No active match');tx.update(ref,{status:'finished',winner:1-side,lastAction:{side,kind:'concede',previousMove:r.move},log:[`${side===0?'Host':'Guest'} conceded.`,...(r.log||[])].slice(0,35)})})}
document.addEventListener('click',async e=>{const b=e.target.closest('[data-online]');if(!b||busy)return;const action=b.dataset.online;try{if(action==='copy'){await navigator.clipboard.writeText(roomCode);info='Room code copied';show();return}if(action==='leave'){unsubscribe?.();unsubscribe=null;roomCode='';room=null;info='Left room (match remains in Firestore)';show();return}busy=true;if(action==='create')await create();if(action==='join')await join();if(action==='attack')await attack(Number(b.dataset.index));if(action==='concede')await concede()}catch(err){console.error(err);info=err.code==='permission-denied'?'Firestore rejected this move. Make sure you published the Update 14 rules.':err.message||String(err);show()}finally{busy=false;show()}});
onAuthStateChanged(auth,user=>{uid=user?.uid||null;if(uid){info='Signed in anonymously';show()}else signInAnonymously(auth).catch(err=>{info='Sign-in failed: '+err.message;show()})});
</script></body></html>
